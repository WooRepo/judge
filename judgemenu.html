<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
    <title>CHATJPT</title>
    <link rel="stylesheet" href="menu.css">
    <script type="module" src="judge.js" defer></script>
  </head>
  <body>
    <p class="judgeResponse" id="judgeResponse">Hello! I am CHATJPT.</p>
    <div class="buttonDiv">
      <button type="button" id="caseFiles" name="caseFiles" class="caseFiles" onclick="document.getElementById('caseFilesPopup').showModal()">View Case Files</button>
    </div>
    <dialog class="caseFilesPopup" id="caseFilesPopup">
      <h2 id="popupTitle">Case Files</h2>
      <p id="popupText">null</p>
      <button type="button" onclick="document.getElementById('caseFilesPopup').close()">OK</button>
    </dialog>
    <textarea id="defenseEnter" name="defenseEnter" class="defenseEnter" placeholder="Please enter your defense." cols="70" rows="10" minlength="1" maxlength="800" spellcheck required></textarea>
    <button type="button" id="defenseButton" name="defenseButton" class="defenseButton">Enter</button>
    <button type="button" id="restartButton" name="restartButton" class="restartButton" onclick="window.location.reload();">⟳</button>
    <button type="button" id="backButton" name="backButton" class="backButton" onclick="window.location.href = '/index.html';">Back</button>
  </body>
</html>
